# Dependabot: keeps the GitHub Actions used by the workflows up to date (a pull request when a new version is out).
# The addon itself has no package dependencies to watch.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
